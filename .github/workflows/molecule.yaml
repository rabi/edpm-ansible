name: Run Molecule tests

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - '.github/**'
    - 'roles/**'
    - 'plugins/**'
    - 'molecule-requirements.txt'
    - 'requirements.yml'
    - 'molecule/**'
  workflow_dispatch:
jobs:
  run_molecule:
    strategy:
      fail-fast: false
      matrix:
        tested_role:
        - edpm_ceph_client_files
        - edpm_ceph_hci_pre
        - edpm_container_manage
        - edpm_cyborg
        - edpm_container_rm
        - edpm_container_standalone
        - edpm_ddp_package
        - edpm_derive_pci_device_spec
        - edpm_download_cache
        - edpm_growvols
        - edpm_instanceha_monitoring
        - edpm_network_config
        - edpm_neutron_dhcp
        - edpm_neutron_metadata
        - edpm_neutron_sriov
        - edpm_nftables
        - edpm_nodes_validation
        - edpm_ovn
        - edpm_reboot
        - edpm_swift
        - edpm_sshd
        - edpm_ssh_known_hosts
        - edpm_timezone
        - edpm_telemetry
        - edpm_telemetry_logging
        - edpm_users
        - env_data
        - edpm_pre_adoption_validation

    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Check whether the role or the molecule harness is modified
      id: check_role
      run: |
        # GITHUB_BASE_REF is only populated for pull_request events. Without a
        # base there is no diff to gate on, so a dispatched run tests everything
        # instead of reporting success without running molecule at all.
        if [[ -z "$GITHUB_BASE_REF" ]]; then
          echo "modified=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        git fetch --no-tags origin "$GITHUB_BASE_REF"
        # The molecule harness (this workflow, the shared Containerfile and the
        # python/collection requirements) is used by every role, so a change to
        # it has to run the whole matrix, not just the roles it also touches.
        if [[ $(git diff --name-only "origin/$GITHUB_BASE_REF" | grep -E '^(\.github/|molecule/|plugins/|molecule-requirements\.txt$|requirements\.yml$)') ]]; then
          echo "modified=true" >> $GITHUB_OUTPUT
        elif [[ $(git diff --name-only "origin/$GITHUB_BASE_REF" roles | grep "${{ matrix.tested_role }}/") ]]; then
          echo "modified=true" >> $GITHUB_OUTPUT
        else
          echo "modified=false" >> $GITHUB_OUTPUT
        fi
    - name: Select molecule destroy strategy
      id: flags
      run: |
        # These roles fail on ubuntu-24.04 for reasons that are only visible
        # from inside a live instance, so keep the instance around on failure.
        destroy=always
        case "${{ matrix.tested_role }}" in
        edpm_cyborg | edpm_neutron_sriov | edpm_telemetry_logging)
          destroy=never
          ;;
        esac
        echo "destroy=$destroy" >>$GITHUB_OUTPUT
    - name: Install ansible
      if: steps.check_role.outputs.modified == 'true'
      run: pip install ansible
    - name: Install collections
      if: steps.check_role.outputs.modified == 'true'
      run: ansible-galaxy collection install --force -r requirements.yml
    - name: Install molecule deps
      if: steps.check_role.outputs.modified == 'true'
      run: pip install -r molecule-requirements.txt
    - name: Run molecule test
      if: steps.check_role.outputs.modified == 'true'
      run: |
        cd $GITHUB_WORKSPACE/roles/${{ matrix.tested_role }}
        molecule test --all --destroy ${{ steps.flags.outputs.destroy }}
      env:
        PY_COLORS: '1'
        ANSIBLE_FORCE_COLOR: '1'
        ANSIBLE_VERBOSITY: 4
        ANSIBLE_CALLBACKS_ENABLED: profile_tasks
    - name: Collect diagnostics from surviving instances
      if: failure() && steps.flags.outputs.destroy == 'never'
      run: |
        set +e
        echo '##### host AppArmor denials #####'
        # unix_chkpwd reaching /etc/shadow is blocked by the ubuntu
        # unix-chkpwd profile, which surfaces as a PAM account error.
        sudo dmesg | grep -i apparmor | tail -n 60
        echo '##### molecule instances #####'
        for inst in $(podman ps --format '{{.Names}}'); do
          echo "===== instance: $inst ====="
          echo '--- failed units (exit status) ---'
          podman exec "$inst" systemctl --failed --no-pager
          echo '--- shadow mode ---'
          podman exec "$inst" ls -l /etc/shadow
          echo '--- priority err and above ---'
          podman exec "$inst" journalctl -p err --no-pager -n 200
          # The quadlet unit journal is the only place the podman exit status
          # is recorded once the container is gone. A <name>.container quadlet
          # becomes <name>.service, so key the lookup off the container names.
          echo '--- all service units ---'
          podman exec "$inst" systemctl list-units --all --type=service --no-legend --plain
          echo '--- nested containers ---'
          podman exec "$inst" podman ps -a
          # CONTAINER_NAME keeps stdout and stderr after --rm deletes the
          # container, and _COMM=podman gives the create/died lifecycle.
          echo '--- lifecycle events ---'
          podman exec "$inst" journalctl --no-pager -a --since '-30 min' _COMM=podman 2>/dev/null | tail -n 80
          # A container started with --rm that exits is absent from podman ps
          # by the time we look, so take the name set from the journal too.
          names=$(podman exec "$inst" podman ps -a --format '{{.Names}}' 2>/dev/null)
          json=$(podman exec "$inst" journalctl --no-pager -a --since '-30 min' -o json 2>/dev/null)
          journal_names=$(echo "$json" | grep -o '"CONTAINER_NAME":"[^"]*"' | cut -d'"' -f4 | sort -u)
          for name in $(echo "$names"; echo "$journal_names" | sort -u); do
            echo "=== container $name ==="
            podman exec "$inst" systemctl status --no-pager -l "$name".service 2>&1 | head -n 30
            # The sriov PAM failure happens in the nested kolla container, so
            # its own /etc/shadow mode is what matters there.
            podman exec "$inst" podman exec "$name" ls -l /etc/shadow 2>&1
            podman exec "$inst" journalctl --no-pager -a --since '-30 min' CONTAINER_NAME="$name" | tail -n 200
          done
        done
        exit 0
