name: faithful instance probe (fork, throwaway)

# Uses molecule itself to create the edpm_telemetry_logging instance (same
# Containerfile.j2, same podman driver flags as CI), then runs a battery of
# systemd/service experiments inside it. ubuntu-22.04 vs ubuntu-24.04.
# Results are written to $GITHUB_STEP_SUMMARY, which is readable via
#   GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs/{job_id}/summary
# (annotations are capped at 10 per check run; logs/artifacts live on blob
#  storage that is unreachable from some networks).

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
        - ubuntu-22.04
        - ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Install ansible
      run: pip install ansible
    - name: Install collections
      run: ansible-galaxy collection install --force -r requirements.yml
    - name: Install molecule deps
      run: pip install -r molecule-requirements.txt
    - name: Create instance with molecule
      run: |
        cd "$GITHUB_WORKSPACE/roles/edpm_telemetry_logging"
        molecule create 2>&1 | tail -20
        podman ps -a --format '{{.Names}} {{.Status}} {{.Image}}'
    - name: Experiments inside the molecule instance
      run: |
        OUT=$RUNNER_TEMP/out.md
        {
        echo "### runner ${{ matrix.runs-on }}"
        echo
        echo '```'
        E() { echo "+ $*"; podman exec instance sh -c "$*" 2>&1; echo "  -> rc=$?"; }
        echo "## host tooling"
        podman --version; podman info --format 'cgroup={{.Host.CgroupVersion}} mgr={{.Host.CgroupManager}} rootless={{.Host.Security.Rootless}}' 2>/dev/null
        crun --version 2>/dev/null | head -1
        stat -fc 'host cgroup fstype=%T' /sys/fs/cgroup
        echo
        echo "## container identity"
        E 'rpm -q rsyslog systemd; uname -r'
        E 'cat /proc/1/comm; systemctl --version | head -1'
        E 'grep -E "CapEff|CapBnd" /proc/1/status'
        E 'findmnt -no SOURCE,FSTYPE,OPTIONS /sys/fs/cgroup'
        E 'cat /proc/1/cgroup'
        E 'ls /sys/fs/cgroup/ | head -20'
        E 'cat /sys/fs/cgroup/cgroup.controllers 2>&1; cat /sys/fs/cgroup/cgroup.subtree_control 2>&1'
        E 'touch /sys/fs/cgroup/.w 2>&1 && echo CGROUP_RW || echo CGROUP_RO; rm -f /sys/fs/cgroup/.w'
        echo
        echo "## rsyslog lifecycle"
        E 'systemctl is-enabled rsyslog 2>&1; systemctl is-active rsyslog 2>&1'
        E 'systemctl start rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'ls -l /sys/fs/cgroup/system.slice/rsyslog.service/cgroup.kill 2>&1'
        E 'cat /sys/fs/cgroup/system.slice/rsyslog.service/cgroup.kill 2>&1 | head -1'
        E 'systemctl restart rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'journalctl -u rsyslog --no-pager -b | tail -20'
        echo
        echo "## variant: KillMode=process"
        E 'mkdir -p /etc/systemd/system/rsyslog.service.d; printf "[Service]\nKillMode=process\n" > /etc/systemd/system/rsyslog.service.d/override.conf; systemctl daemon-reload'
        E 'systemctl restart rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'journalctl -u rsyslog --no-pager -b | tail -8'
        echo
        echo "## variant: KillMode=none"
        E 'printf "[Service]\nKillMode=none\n" > /etc/systemd/system/rsyslog.service.d/override.conf; systemctl daemon-reload'
        E 'systemctl stop rsyslog 2>&1; sleep 1; systemctl start rsyslog 2>&1; sleep 2; systemctl is-active rsyslog'
        E 'printf "[Service]\nKillMode=process\n" > /etc/systemd/system/rsyslog.service.d/override.conf; systemctl daemon-reload'
        echo
        echo "## variant: SUID/priv sanity"
        E 'grep -E "NoNewPrivs|Seccomp|Seccomp_filters" /proc/1/status'
        E 'systemd-analyze security rsyslog 2>&1 | head -12'
        } > "$OUT" 2>&1
        cat "$OUT"
        cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
        head -c 1500 "$OUT" | sed -e 's/:/%3A/g' -e 's/%/%25/g' | paste -sd '%0A' - | { read -r m; echo "::notice title=OUT(${{ matrix.runs-on }})::$m"; }
    - name: Verdict line
      if: always()
      run: |
        grep -E 'is-active|rc=' "$RUNNER_TEMP/out.md" 2>/dev/null | tail -12 || true
