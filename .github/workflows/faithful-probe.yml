name: faithful instance probe (fork, throwaway)

# Creates the edpm_telemetry_logging instance with molecule itself (same
# Containerfile.j2, same podman driver flags as CI), then runs systemd/service
# experiments inside it on ubuntu-22.04 vs ubuntu-24.04.
# Publishing channel: annotations are capped at 10 per check run and
# logs/artifacts sit on blob storage unreachable from some networks, so the
# report is emitted as (a) KEY annotations for the decisive lines and (b) the
# full dump as a job summary.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
        - ubuntu-22.04
        - ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Install ansible
      run: pip install ansible
    - name: Install collections
      run: ansible-galaxy collection install --force -r requirements.yml
    - name: Install molecule deps
      run: pip install -r molecule-requirements.txt
    - name: Create instance with molecule
      run: |
        cd "$GITHUB_WORKSPACE/roles/edpm_telemetry_logging"
        molecule create 2>&1 | tail -15
        podman ps -a --format '{{.Names}} {{.Status}} {{.Image}}' | tee "$RUNNER_TEMP/ps.txt"
    - name: Experiments inside the molecule instance
      if: always()
      run: |
        set +e
        OUT=$RUNNER_TEMP/out.txt
        : > "$OUT"
        E() { echo "+ $*" >> "$OUT"; podman exec instance sh -c "$*" >> "$OUT" 2>&1; echo "  rc=$?" >> "$OUT"; }
        echo "## host tooling ($(grep PRETTY /etc/os-release))" >> "$OUT"
        podman --version >> "$OUT" 2>&1
        podman info --format 'cgroup={{.Host.CgroupVersion}} mgr={{.Host.CgroupManager}} rootless={{.Host.Security.Rootless}}' >> "$OUT" 2>&1
        crun --version 2>/dev/null | head -1 >> "$OUT"
        E 'rpm -q systemd rsyslog; systemctl --version | head -1'
        E 'dnf -qq -y install rsyslog >/dev/null; rpm -q rsyslog'
        E 'grep -E "CapEff|CapBnd|NoNewPrivs|Seccomp:" /proc/1/status'
        E 'findmnt -no SOURCE,FSTYPE,OPTIONS /sys/fs/cgroup; cat /proc/1/cgroup'
        E 'cat /sys/fs/cgroup/cgroup.controllers; cat /sys/fs/cgroup/cgroup.subtree_control'
        E 'touch /sys/fs/cgroup/.w 2>/dev/null && echo CGROUP_RW || echo CGROUP_RO; rm -f /sys/fs/cgroup/.w'
        E 'systemctl is-enabled rsyslog; systemctl is-active rsyslog'
        E 'systemctl start rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'ls /sys/fs/cgroup/system.slice/rsyslog.service/ 2>&1 | tr "\n" " "'
        E 'systemctl restart rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'journalctl -u rsyslog --no-pager -b | tail -18'
        E 'mkdir -p /etc/systemd/system/rsyslog.service.d'
        E 'printf "[Service]\nKillMode=process\n" >/etc/systemd/system/rsyslog.service.d/o.conf; systemctl daemon-reload; systemctl restart rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'printf "[Service]\nKillMode=none\n" >/etc/systemd/system/rsyslog.service.d/o.conf; systemctl daemon-reload; systemctl stop rsyslog; sleep 1; systemctl start rsyslog; sleep 2; systemctl is-active rsyslog'
        E 'rm -f /etc/systemd/system/rsyslog.service.d/o.conf; systemctl daemon-reload; systemctl kill -s HUP rsyslog; sleep 1; systemctl is-active rsyslog'
        exit 0
    - name: Publish
      if: always()
      run: |
        set +e
        OUT=$RUNNER_TEMP/out.txt
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        grep -E '^\+ (systemctl|ls |printf|rm )|^(active|inactive|failed)|  rc=|CGROUP_|cgroup=|CapEff|CapBnd|KillMode|Main process|control group' "$OUT" \
          | head -9 | sed -e 's/:/%3A/g' -e 's/%/%25/g' \
          | while IFS= read -r l; do echo "::notice title=KEY(${{ matrix.runs-on }})::$l"; done
    - name: Verdict
      if: always()
      run: |
        set +e
        grep -nE 'systemctl (start|restart)|^active$|^inactive$|^failed$|  rc=' "$RUNNER_TEMP/out.txt" \
          | sed -e 's/:/%3A/g' -e 's/%/%25/g' | tail -9 \
          | while IFS= read -r l; do echo "::warning title=SEQ(${{ matrix.runs-on }})::$l"; done
