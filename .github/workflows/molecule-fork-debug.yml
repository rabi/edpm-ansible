name: Run Molecule tests (fork debug, no gate)

# Throwaway copy of molecule.yaml with the check_role "modified" gate removed,
# so the matrix actually executes on the fork. No continue-on-error: a red job
# means molecule failed.
#
# Raw logs and artifacts are served from blob storage that is not reachable
# from everywhere, so all diagnosis is published as ::error:: annotations
# (GET /repos/{o}/{r}/check-runs/{id}/annotations) and the step summary.

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  molecule:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
        - ubuntu-22.04
        - ubuntu-24.04
        tested_role:
        - edpm_telemetry_logging
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Install ansible
      run: pip install ansible
    - name: Install collections
      run: ansible-galaxy collection install --force -r requirements.yml
    - name: Install molecule deps
      run: pip install -r molecule-requirements.txt
    - name: Run molecule test
      run: |
        cd $GITHUB_WORKSPACE/roles/${{ matrix.tested_role }}
        set +e
        molecule test --all --destroy never 2>&1 | tee "$RUNNER_TEMP/molecule.log"
        rc=${PIPESTATUS[0]}
        set -e
        echo "molecule_rc=${rc}" >> "$GITHUB_ENV"
        echo "molecule test --all for ${{ matrix.tested_role }} on ${{ matrix.runs-on }}: rc=${rc}"
        exit "${rc}"
      env:
        PY_COLORS: '1'
        ANSIBLE_FORCE_COLOR: '1'
        ANSIBLE_VERBOSITY: 2
        ANSIBLE_CALLBACKS_ENABLED: profile_tasks
    - name: Diagnose instance
      if: always()
      run: |
        strip() { sed -e 's/\x1b\[[0-9;]*m//g'; }
        {
          echo "=== instance state ==="
          podman ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "=== failing service inside instance ==="
          podman exec instance systemctl --failed --no-legend --no-pager 2>&1 || true
          echo "=== rsyslogd config check (-N1) ==="
          podman exec instance rsyslogd -N1 2>&1 | tail -25 || true
          echo "=== journalctl -u rsyslog ==="
          podman exec instance journalctl -u rsyslog --no-pager -b 2>&1 | tail -40 || true
          echo "=== status of rsyslog ==="
          podman exec instance systemctl status rsyslog --no-pager -l 2>&1 | tail -30 || true
        } > "$RUNNER_TEMP/diag.log" 2>&1
        cat "$RUNNER_TEMP/diag.log"
        {
          echo "### molecule ${{ matrix.tested_role }} on ${{ matrix.runs-on }} -- molecule_rc=${molecule_rc}"
          echo '```'
          grep -inE 'play recap|fatal:|failed to|pam |error' "$RUNNER_TEMP/molecule.log" | strip | tail -25
          echo '--- instance diagnosis ---'
          tail -60 "$RUNNER_TEMP/diag.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        {
          grep -inE 'fatal:|failed to|pam |error|invalid|unterminated' "$RUNNER_TEMP/molecule.log" | strip | tail -12
          grep -inE 'error|invalid|fail|cannot|refused|denied' "$RUNNER_TEMP/diag.log" | strip | tail -18
        } | while IFS= read -r line; do
          echo "::error title=${{ matrix.runs-on }} / ${{ matrix.tested_role }}::${line}"
        done
    - name: Destroy instance
      if: always()
      run: |
        cd $GITHUB_WORKSPACE/roles/${{ matrix.tested_role }}
        molecule destroy || true
